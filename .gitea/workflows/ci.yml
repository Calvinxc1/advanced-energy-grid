name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Factorio mod
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REPOSITORY: factorio-modding/advanced-energy-grid
          GITEA_SERVER_URL: https://gitea.infra.newedenhomestead.net
        run: |
          set -euxo pipefail
          git --version
          git init .
          git remote add origin "$GITEA_SERVER_URL/$CHECKOUT_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git rev-parse HEAD

      - name: Install validation tools
        run: |
          set -eux
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache \
              bash \
              ca-certificates \
              curl \
              lua5.4 \
              python3 \
              py3-yaml \
              ripgrep \
              xz
            ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends \
              bash \
              ca-certificates \
              curl \
              lua5.4 \
              python3 \
              python3-yaml \
              ripgrep \
              xz-utils
            ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
          else
            echo "No supported package manager found. Expected apk or apt-get." >&2
            exit 1
          fi
          bash --version
          python3 --version
          python3 -c "import yaml; print('pyyaml available')"
          luac -v
          rg --version

      - name: Install Factorio headless
        run: |
          set -eux
          factorio_dir="${RUNNER_TEMP:-/tmp}/factorio-headless"
          archive="${RUNNER_TEMP:-/tmp}/factorio-headless.tar.xz"
          mkdir -p "$factorio_dir"
          curl -fsSL \
            "https://factorio.com/get-download/stable/headless/linux64" \
            -o "$archive"
          tar -xf "$archive" -C "$factorio_dir" --strip-components=1
          "$factorio_dir/bin/x64/factorio" --version
          echo "FACTORIO_BIN=$factorio_dir/bin/x64/factorio" >> "$GITHUB_ENV"

      - name: Prepare temporary Factorio mods directory
        run: |
          mods_dir="${RUNNER_TEMP:-/tmp}/factorio-mods"
          mkdir -p "$mods_dir"
          ln -s "$PWD/src" "$mods_dir/advanced-energy-grid"
          echo "FACTORIO_MODS_DIR=$mods_dir" >> "$GITHUB_ENV"

      - name: Validate mod
        env:
          AEG_REQUIRE_FACTORIO: "1"
        run: ./scripts/validate.sh
