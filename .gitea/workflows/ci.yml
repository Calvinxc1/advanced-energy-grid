name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Factorio mod
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        env:
          CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REPOSITORY: factorio-modding/advanced-energy-grid
          GITEA_SERVER_URL: https://gitea.infra.newedenhomestead.net
        run: |
          set -euxo pipefail
          git --version
          git init .
          git remote add origin "$GITEA_SERVER_URL/$CHECKOUT_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout --force FETCH_HEAD
          git rev-parse HEAD

      - name: Install validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            lua5.4 \
            python3 \
            python3-yaml \
            ripgrep
          ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Prepare temporary Factorio mods directory
        run: |
          mods_dir="${RUNNER_TEMP:-/tmp}/factorio-mods"
          mkdir -p "$mods_dir"
          ln -s "$PWD/src" "$mods_dir/advanced-energy-grid"
          echo "FACTORIO_MODS_DIR=$mods_dir" >> "$GITHUB_ENV"

      - name: Validate mod
        env:
          AEG_REQUIRE_FACTORIO: "1"
        run: ./scripts/validate.sh
