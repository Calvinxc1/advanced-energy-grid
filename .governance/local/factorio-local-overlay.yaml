schema: factorio_local_overlay
schema_version: 1
mod_name: advanced-energy-grid
canonical_agent_name: Advanced Energy Grid Factorio Modding Agent
workspace_path: /home/jcherry/Documents/git/factorio-mods/advanced-energy-grid
metadata_path: src/info.json
namespace_prefixes:
  - advanced-energy-grid
  - aeg
dependency_stack:
  - base >= 2.1.0
  - space-age >= 2.1.0
optional_dependencies:
  - PowerOverload >= 2.2.0
  - Krastorio2
  - Krastorio2-spaced-out
  - space-exploration
upstream_or_fork_source: local Factorio mod workspace for Jason M. Cherry
scope_boundaries:
  - Owns electric poles, substations, long-distance transmission, electric distribution/transmission technologies, recipes, items, and entities for grid infrastructure.
  - Owns optional Power Overload huge-pole integration for Advanced Energy Grid pole tiers.
  - Does not own generation or storage content retained by Advanced Power Infrastructure, including boilers, steam engines, turbines, heat exchangers, heat pipes, reactors, fusion, solar, accumulators, and power footprint benchmarks.
release_target: Factorio 2.1 with Space Age
changelog_format: Factorio mod portal format in src/changelog.txt
validation_available:
  json: ./scripts/validate.sh validates src/info.json
  lua_syntax: ./scripts/validate.sh runs luac -p for Lua files under src
  lint: not established beyond JSON, YAML, and Lua syntax checks
  format: not established
  factorio_load: ./scripts/validate.sh delegates to ./scripts/factorio-validate.sh when Factorio and mod symlink are available
workspace_specific_rules:
  - "Krastorio 2 (? Krastorio2, and Spaced Out through it) and Space Exploration (? space-exploration) are optional dependencies, set by Jason on 2026-09-25. This mod's reach and coverage numbers carry; K2's recipes and unlocks for its own poles are kept. K2 raises the vanilla poles in its data-updates, so src/prototypes/electric/krastorio2-updates.lua sets them back to the first rung of each ladder. K2's kr-superior-substation is the substation mk4 (optional_dependencies.name maps aeg_substation-4 and its technology onto K2's): its recipe takes aeg_substation-3 in place of substation and electric-energy-distribution-3 follows the substation mk3 technology."
  - "The late tiers (big pole mk4, substation mk4, huge pole mk3/mk4) exist under Space Age, Krastorio 2 or Space Exploration. Their entities and items live in src/prototypes/electric/late-tiers/, with recipes and technologies from the first of space-age/, krastorio2/, space-exploration/ that applies. The elite gate is electromagnetic science (Space Age), energy science 1 (SE, with or without K2), the matter tech card (K2), or space science (base game). Overhaul tier technologies inherit their prerequisites' packs unless no lab accepts the result (K2 with Space Age splits its labs)."
  - "Under Power Overload each tier's default doubles the tier below, starting from Power Overload's Tier 1 default for the load; Power Overload raises those under Krastorio 2 (small 20MW, medium 200MW, big 2GW, substation 400MW, huge 10GW), and kr-superior-substation is registered as the substation mk4. Jason chose this on 2026-09-25."
  - Preserve src/info.json dependencies unless Jason explicitly changes the mod dependency contract.
  - Keep Power Overload integration optional.
  - Do not publish, tag, package, upload, release, or push unless Jason explicitly asks.
migration_notes:
  - Local governance was migrated to factorio-modding-agent/factorio-modding-agent/1.0.0.
  - Superseded pre-Factorio local governance evidence was removed on Jason's 2026-07-07 instruction.
  - Stale governance-repo maintainer deviations and local index were removed because they described ai-governance repository maintenance, not this mod workspace.
  - The old canonical prompt path lab-governance/templates/governed-agent-update-prompt.md was not present on the target source branch; this update followed Jason's explicit migration instructions and used available source templates.
  - Gitflow stage and release workflow facts are recorded in .governance/local/factorio-workflow.yaml.
notes: Local facts are derived from src/info.json, README.md, src/README.md, and scripts/validate.sh. Do not put secrets or credentials here.
