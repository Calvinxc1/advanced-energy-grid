schema: factorio_local_workflow
schema_version: 1
mod_name: advanced-energy-grid
canonical_agent_name: Advanced Energy Grid Factorio Modding Agent
workspace_path: /home/jcherry/Documents/git/factorio-mods/advanced-energy-grid
metadata_path: src/info.json
ownership_model: internal_mod
upstream_or_fork_source: local Factorio mod workspace for Jason M. Cherry
namespace_prefixes:
  - advanced-energy-grid
  - aeg
dependency_stack:
  - base >= 2.1.0
  - space-age >= 2.1.0
optional_dependencies:
  - PowerOverload >= 1.6.0
scope_boundaries:
  - Owns electric poles, substations, long-distance transmission, electric distribution/transmission technologies, recipes, items, and entities for grid infrastructure.
  - Owns optional Power Overload huge-pole integration for Advanced Energy Grid pole tiers.
  - Does not own generation or storage content retained by Advanced Power Infrastructure, including boilers, steam engines, turbines, heat exchangers, heat pipes, reactors, fusion, solar, accumulators, and power footprint benchmarks.
release_target: Factorio 2.1 with Space Age
internal_gitflow_stage: full_gitflow
branch_roles:
  main: Release authority; pushes validate and publish only when src/info.json version changes.
  dev: Long-lived integration branch for ratified work before release promotion.
  feature: Short-lived implementation or parked-work branches created from dev and merged back to dev.
  release: Short-lived release or promotion branches created from dev and merged into main.
  hotfix: Urgent correction branches from main when needed.
release_promotion_path: Promote dev to main through short-lived release/<version-or-purpose> branches; do not keep a standing dev-to-main pull request open.
feature_branching_enabled: true
release_branching_enabled: true
main_branch_protection:
  enabled: null
  notes: Branch protection was not exposed by the available Gitea connector during the 2026-07-08 review.
hotfix_flow:
  enabled: true
  branch_pattern: hotfix/<version-or-topic>
  sync_requirements:
    - Sync every hotfix merged to main back into dev before resuming ordinary dev work.
    - Evaluate whether the hotfix must also be merged or cherry-picked into any active release branch.
post_release_main_to_dev_sync:
  required: true
  mechanism: Manual merge or fast-forward from main back to dev after release branch merge.
  automation_validated: false
  failure_owner: Jason or the acting agent assigned to the release or promotion.
ci_cd_release_gates:
  validation: Gitea Actions pull request validation runs ./scripts/validate.sh with AEG_REQUIRE_FACTORIO=1; main pushes also validate before release detection.
  packaging: .gitea/workflows/deploy.yml packages with ./scripts/package.sh only when src/info.json version changes on main or when retrying missing release destinations for an existing tag.
  publishing: Main-push deploy workflow creates or updates Gitea release assets, GitHub mirror releases, Factorio Mod Portal uploads, and Discord release changelog posts when release gates are satisfied and required secrets are present.
  post_release_sync: Not automated; sync main back to dev manually after main promotion.
changelog_process:
  format: Factorio mod portal changelog format in src/changelog.txt.
  pending_notes_mechanism: For release work, update the top src/changelog.txt entry to match src/info.json before merging the release branch to main.
  top_version_must_match_metadata: true
validation_available:
  json: ./scripts/validate.sh validates src/info.json
  lua_syntax: ./scripts/validate.sh runs luac -p for Lua files under src
  lint: YAML parsing is included when PyYAML is available; no broader lint tool is established.
  format: Not established.
  factorio_load: ./scripts/validate.sh delegates to ./scripts/factorio-validate.sh; CI requires a Factorio headless runner with AEG_REQUIRE_FACTORIO=1.
declared_deviations: []
workspace_specific_rules:
  - Preserve src/info.json dependencies unless Jason explicitly changes the mod dependency contract.
  - Keep Power Overload integration optional.
  - Use feature/* branches for ordinary scoped implementation, parked work, and CI/CD changes before merging to dev.
  - Do not manually publish, tag, package, upload, release, or push unless Jason explicitly asks.
  - Do not merge or release feature/power-overload-registry-interface until the upstream Power Overload registry interface is available and Jason explicitly resumes that work.
  - Main-push release automation is allowed only through the documented release branch process and required repository secrets.
migration_notes:
  - Stage review on 2026-07-08 found remote branches main and dev only, no tags, no release branches, and no hotfix branches.
  - PR #1 from dev to main was closed unmerged on 2026-07-08 because a standing dev-to-main PR conflicts with the intended Gitea workflow for this repository.
  - AFI-style CI/CD was ported on 2026-07-08 from Advanced Fluid Infrastructure main/dev plus feature/discord-release-changelog.
  - Power Overload registry integration was removed from dev on 2026-07-08 and parked on feature/power-overload-registry-interface.
  - On 2026-07-09 Jason declared AEG to be in full compliance with the governance GitFlow policy.
  - Deploy release automation was removed from dev/main and parked for review on feature/deploy-workflow.
last_stage_reviewed_at: 2026-07-09
known_gaps:
  - Branch protection status is unknown because the available Gitea connector does not expose it.
  - Gitea Actions run listing was unavailable through the connector during review.
  - AEG repository secrets must exist before first automated release: GH_RELEASE_TOKEN, FACTORIO_MOD_PORTAL_TOKEN, and DISCORD_RELEASE_WEBHOOK_URL. The built-in GITEA_TOKEN must have release write permission.
  - No automated main-to-dev sync process is established.
notes: Do not put secrets or credentials here.
