electric-pole=Allows access to additional ranks of Small, Medium, and Big Electric Poles.
aeg_improved-electric-poles=Improves early electric pole reach and coverage.
electric-energy-distribution-1=Splits basic pole progression into local distribution and distance transmission branches.
electric-energy-distribution-2=Unlocks the first improved local distribution substation.
aeg_local-energy-distribution-improved=Improves local factory power distribution.
aeg_local-energy-distribution-advanced=Further improves local factory power distribution.
aeg_local-energy-distribution-elite=Maximizes local factory power distribution.
aeg_distance-power-transmission-improved=Improves long-range power transmission.
aeg_distance-power-transmission-advanced=Further improves long-range power transmission.
aeg_distance-power-transmission-elite=Maximizes long-range power transmission.
electric-substation=Allows access to additional ranks of Substations.
aeg_improved-local-energy-distribution-improved=Improves dense local factory power coverage.
aeg_improved-local-energy-distribution-advanced=Further improves dense local factory power coverage.
aeg_improved-local-energy-distribution-elite=Maximizes dense local factory power coverage.
aeg_improved-distance-power-transmission-improved=Improves long-range huge pole transmission.
aeg_improved-distance-power-transmission-advanced=Further improves long-range huge pole transmission.
aeg_improved-distance-power-transmission-elite=Maximizes long-range huge pole transmission.
po-electric-energy-distribution-3=Unlocks the first huge electric pole for long-range transmission.

